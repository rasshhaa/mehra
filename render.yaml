# Render Blueprint — full app (engine audio + inspection + Firebase)
# One-click: https://render.com/deploy?repo=https://github.com/rasshhaa/mehra
services:
  - type: web
    name: autovault
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: prototype5
    plan: standard
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_FIRESTORE
        value: "1"
      - key: FIREBASE_PRIMARY_PROJECT_ID
        value: mehra-b3a7c
      - key: HF_HOME
        value: /app/backend/.cache/huggingface
      - key: GROQ_API_KEY
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
