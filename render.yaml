# Render Blueprint — full app
# Free + engine: use Dockerfile.free + HF_TOKEN (Hugging Face Inference API)
# Paid Standard: use Dockerfile (local torch, no HF token required)
services:
  - type: web
    name: autovault
    runtime: docker
    dockerfilePath: ./Dockerfile.free
    dockerContext: .
    branch: prototype5
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: USE_FIRESTORE
        value: "1"
      - key: FIREBASE_PRIMARY_PROJECT_ID
        value: mehra-b3a7c
      - key: ENGINE_MODE
        value: remote
      - key: GROQ_API_KEY
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
